apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumina-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lumina-gateway
  template:
    metadata:
      labels:
        app: lumina-gateway
    spec:
      containers:
        - name: gateway
          image: lumina-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: deepseek-api-key
            - name: QWEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: qwen-api-key
            - name: GATEWAY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: master-key
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: lumina-gateway
spec:
  selector:
    app: lumina-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumina-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumina-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
