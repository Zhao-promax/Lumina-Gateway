# Prometheus 告警规则（配合 /actuator/prometheus 抓取）
groups:
  - name: lumina-gateway
    rules:
      - alert: GatewayHighErrorRate
        expr: rate(gateway_errors_total[5m]) / rate(gateway_requests_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "网关错误率超过 10%（5 分钟）"

      - alert: GatewayHighP99Latency
        expr: histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le)) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "网关 P99 延迟超过 30 秒"

      - alert: GatewayErrorSpike
        expr: increase(gateway_errors_total[5m]) > 100
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "网关 5 分钟错误突增超过 100"

      - alert: GatewayLowCacheHitRate
        expr: rate(gateway_cache_total{result="hit"}[10m]) / rate(gateway_cache_total[10m]) < 0.2
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "缓存命中率低于 20%（10 分钟）"

      - alert: GatewayCircuitOpened
        expr: increase(gateway_circuitbreaker_opens_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "下游模型熔断器触发打开"

      - alert: GatewayBudgetWarning
        expr: increase(gateway_budget_warnings_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "租户/应用预算用量达到预警阈值"
