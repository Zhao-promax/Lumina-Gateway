# Lumina Gateway + 中间件 编排（单机 VM 部署）
# 用法：cp .env.example .env 并填写密钥后，执行 docker compose up -d --build
services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      MODE: standalone            # 单机模式（内嵌 Derby 存储；生产多机可换 MySQL）
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 语义缓存用 RediSearch 时启用（普通 redis 不含 RediSearch 模块，需 Redis Stack）
  # 启用后把 gateway.cache.vector-backend 设为 redis-search
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: redis-stack
    ports:
      - "6380:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # 审计落库 MySQL（gateway.audit.mysql-enabled=true 时启用）
  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lumina}
      MYSQL_DATABASE: lumina
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 全链路追踪 SkyWalking（agent 接入见 gateway 注释）
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    container_name: skywalking-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    restart: unless-stopped

  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    container_name: skywalking-ui
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8081:8080"
    restart: unless-stopped

  gateway:
    build: .
    container_name: lumina-gateway
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_started   # Nacos 就绪由 NacosRuleSource 重试保证
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_ADDR: nacos:8848
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-}
      # 审计落库 MySQL
      AUDIT_MYSQL_URL: ${AUDIT_MYSQL_URL:-jdbc:mysql://mysql:3306/lumina}
      AUDIT_MYSQL_USER: ${AUDIT_MYSQL_USER:-root}
      AUDIT_MYSQL_PASSWORD: ${AUDIT_MYSQL_PASSWORD:-lumina}
      # 语义缓存 Embedding
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      # SkyWalking 追踪（启用时取消注释，并挂载 agent 目录）
      # JAVA_TOOL_OPTIONS: "-javaagent:/opt/skywalking/skywalking-agent.jar"
      # SW_AGENT_NAME: lumina-gateway
      # SW_AGENT_COLLECTOR_BACKEND_SERVICES: skywalking-oap:11800
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
