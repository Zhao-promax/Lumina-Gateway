server:
  port: 8080

spring:
  application:
    name: lumina-gateway
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis / RabbitMQ 为可选依赖（默认内存限流 / 仅日志审计），未部署时禁用健康检查，避免整体状态 DOWN
    redis:
      enabled: false
    rabbit:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

gateway:
  auth:
    enabled: true
    timestamp-window-seconds: 300
    apps:
      - app-key: "demo-app"
        app-secret: "demo-secret-please-change"
        tenant: "demo"
  routing:
    default-tag: "default"
    downgrade-enabled: false
    routes:
      - tag: "default"
        models:
          - provider: "deepseek"
            model: "deepseek-chat"
            price: 0.002
            weight: 100
          - provider: "qwen"
            model: "qwen-plus"
            price: 0.0008
            weight: 0
      - tag: "qwen"
        models:
          - provider: "qwen"
            model: "qwen-plus"
            price: 0.0008
            weight: 100
      - tag: "mock"
        models:
          - provider: "mock"
            model: "mock-model"
            price: 0
            weight: 100
  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      wait-duration-in-open-state-ms: 10000
    timeout-ms: 30000
    retry:
      max-attempts: 2
      wait-ms: 200
  rate-limit:
    enabled: true
    backend: "memory"          # memory | redis（redis 需 spring.data.redis 配置）
    permits-per-second: 10
  budget:
    enabled: true
    backend: "memory"          # memory | redis（redis 需 spring.data.redis 配置）
    daily-limit: 100000
    total-limit: 1000000
    default-completion-tokens: 512
  cache:
    exact-enabled: true
    exact-ttl-seconds: 3600
    semantic-enabled: false    # 需 EmbeddingProvider Bean + 可选 Redis Stack
    semantic-threshold: 0.9
  moderation:
    enabled: true
    words: [ "违禁词A", "违禁词B" ]
  audit:
    mq-enabled: false           # true 时异步投递到 RabbitMQ（需部署 RabbitMQ）
    queue: "gateway.audit"
  nacos:
    enabled: false             # 启用后从 Nacos 热更路由规则
    server-addr: "localhost:8848"
    data-id: "lumina-gateway-routing"
    group: "DEFAULT_GROUP"
  mock:
    enabled: false               # 压测/演示时设为 true
    chunk-count: 50
    chunk-delay-ms: 20
  providers:
    deepseek:
      base-url: "https://api.deepseek.com"
      api-key: "${DEEPSEEK_API_KEY:}"
      enabled: true
    qwen:
      base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api-key: "${QWEN_API_KEY:}"
      enabled: true
